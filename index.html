<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b34"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="增肌手账"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>增肌手账 · 8周计划</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#142a26;background:#f3f6f3}*{box-sizing:border-box}body{margin:0;padding-bottom:94px}header{background:#123b34;color:white;padding:calc(env(safe-area-inset-top) + 23px) 20px 24px}header h1{margin:0;font-size:26px}header p{margin:7px 0 0;opacity:.8;font-size:13px}main{max-width:760px;margin:auto;padding:17px}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0 0 9px}.card{background:#fff;border-radius:17px;padding:17px;margin:0 0 14px;box-shadow:0 2px 12px #1d4c3520}.muted{color:#65756f;font-size:13px}.small{font-size:12px}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#e5f3ec;color:#17694b;font-size:12px}.warn{background:#fff0dc;color:#8b4c05}.danger{background:#ffe7e7;color:#a32626}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eaf2ed;border-radius:13px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}button{border:0;border-radius:11px;background:#17674e;color:#fff;font-size:14px;padding:11px 14px;cursor:pointer;font-weight:600}button.secondary{background:#e8efea;color:#205343}button.outline{background:white;color:#17674e;border:1px solid #bdd6c7}button:disabled{background:#c3ccc7;color:#5b6963;cursor:not-allowed}input,select,textarea{font:inherit;border:1px solid #d4ded7;border-radius:10px;padding:10px;background:white;color:#1a302a;min-width:0;max-width:100%}input[type=number]{width:85px}input[type=date]{width:150px}label{font-size:13px;color:#53675e;display:block;margin-bottom:5px}.field{margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #dce8df;padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);z-index:10}.tabs button{background:transparent;color:#63766b;flex:1;max-width:150px;padding:6px 0;font-size:12px;border-radius:8px}.tabs button.active{color:#146849;background:#e8f3ed}.tabs span{display:block;font-size:21px;margin-bottom:2px}.exercise{border-top:1px solid #edf1ee;padding:14px 0}.exercise:first-of-type{border-top:0}.exercise-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.exercise-title strong{font-size:15px}.sets{display:grid;grid-template-columns:35px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin-top:8px}.sets input{width:100%;padding:8px 5px;text-align:center;font-size:14px}.sets .head{font-size:11px;color:#66786c;text-align:center}.sets input[type=checkbox]{width:19px;height:19px;accent-color:#17674e}.day-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #eef2ee;padding:11px 0}.day-row:first-of-type{border-top:0}.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.space{display:flex;justify-content:space-between;align-items:center;gap:10px}.notice{border-left:4px solid #d89837;background:#fff8e9;padding:12px;border-radius:9px;font-size:13px;line-height:1.65}.oknotice{border-left-color:#188263;background:#eef9f1}.chart{width:100%;height:160px;background:#fbfcfb;border-radius:10px}.hidden{display:none}.library-item{border-top:1px solid #edf1ee;padding:12px 0}.library-item summary{cursor:pointer;font-weight:600}.library-item p{font-size:13px;line-height:1.7}.bar{height:9px;background:#e4ede6;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#1e8662}.footer{color:#6b7d73;text-align:center;font-size:12px;padding:15px}a{color:#17674e}@media(max-width:380px){main{padding:11px}.card{padding:13px}.stats{gap:5px}.stat{padding:8px}.stat b{font-size:17px}.sets{grid-template-columns:25px 1fr 1fr 1fr 30px;gap:3px}}
</style></head><body><header><h1>增肌手账 <span style="font-size:14px;font-weight:400">8周计划</span></h1><p>胸 · 肩 · 背 · 手臂 · 下肢｜本机保存 · 离线可用</p></header><main id="app"></main><nav class="tabs" id="tabs"><button data-tab="home"><span>⌂</span>首页</button><button data-tab="train"><span>▤</span>训练</button><button data-tab="library"><span>◈</span>动作</button><button data-tab="progress"><span>↗</span>进度</button><button data-tab="settings"><span>⚙</span>设置</button></nav><script>
'use strict';
const KEY='hypertrophy8_v1';const TODAY=()=>new Date().toLocaleDateString('en-CA');
const exercises={
press:{name:'坐姿器械推胸',muscle:'胸、肱三头肌',type:'upper',restricted:true,detail:'胸大肌为主。避免肘部锁死及任何滑脱感；推举动作必须取得具体动作与负重许可。',sets:2,reps:'10–12'},row:{name:'胸托划船',muscle:'背部、肱二头肌',type:'upper',detail:'胸部贴靠支撑垫，避免猛拉。需确认拉力方向和负重许可。',sets:3,reps:'10–12'},pulldown:{name:'中立握高位下拉',muscle:'背阔肌、肱二头肌',type:'upper',detail:'使用中立握，躯干稳定，不突然伸直肘部。需确认负重许可。',sets:3,reps:'10–12'},lateral:{name:'器械侧平举',muscle:'三角肌中束',type:'upper',detail:'控制动作幅度，不耸肩、不甩动；需确认肘关节可承受。',sets:3,reps:'12–15'},reverse:{name:'反向飞鸟',muscle:'三角肌后束、上背',type:'upper',detail:'轻负荷控制肩胛运动；此动作也需上肢训练许可。',sets:2,reps:'12–15'},curl:{name:'坐姿哑铃弯举',muscle:'肱二头肌',type:'upper',detail:'不借力甩动，不强行伸直；需获得明确许可。',sets:2,reps:'10–15'},hammer:{name:'锤式弯举',muscle:'肱肌、肱桡肌',type:'upper',detail:'中立握，慢速动作；需获得明确许可。',sets:2,reps:'10–15'},triceps:{name:'绳索三头肌下压',muscle:'肱三头肌',type:'upper',restricted:true,detail:'仅在专业人员许可的轻负荷和角度范围内进行，禁止肘关节锁死。',sets:1,reps:'12–15'},fly:{name:'水平飞鸟',muscle:'胸大肌',type:'upper',restricted:true,detail:'用户明确为仅可小重量的动作；当前不列入训练日，待许可后再评估。',sets:2,reps:'12–15'},bench:{name:'卧推',muscle:'胸、肱三头肌',type:'upper',restricted:true,detail:'用户明确为仅可小重量的动作；当前不列入训练日，待许可后再评估。',sets:2,reps:'10–12'},legpress:{name:'坐姿腿举',muscle:'股四头肌、臀',type:'lower',detail:'选择不需要左手支撑承重的设备；首次从较低档位开始。',sets:3,reps:'10–12'},extension:{name:'腿屈伸',muscle:'股四头肌',type:'lower',detail:'控制抬起和放下，避免突然发力。',sets:3,reps:'12–15'},legcurl:{name:'坐姿腿弯举',muscle:'腘绳肌',type:'lower',detail:'背部贴靠，缓慢屈膝。',sets:3,reps:'10–12'},calf:{name:'坐姿提踵',muscle:'小腿',type:'lower',detail:'保持稳定，选择不需左肘负重的设备。',sets:3,reps:'12–15'},abduction:{name:'臀外展器械',muscle:'臀中肌',type:'lower',detail:'稳定坐姿，缓慢外展与还原。',sets:3,reps:'12–15'}};
const days=[{name:'上肢 A',focus:'胸 · 背 · 肩 · 二头',ids:['press','row','pulldown','lateral','reverse','curl']},{name:'下肢 A',focus:'股四头肌 · 臀腿',ids:['legpress','extension','legcurl','calf']},{name:'休息',focus:'恢复',ids:[]},{name:'上肢 B',focus:'背 · 肩 · 胸 · 手臂',ids:['pulldown','row','press','lateral','reverse','hammer','triceps']},{name:'下肢 B',focus:'臀腿后侧 · 小腿',ids:['legcurl','legpress','abduction','calf']},{name:'休息',focus:'恢复',ids:[]},{name:'休息',focus:'恢复',ids:[]}];
const initial=()=>({version:1,startDate:TODAY(),upperCleared:false,lowerCleared:false,upperNote:'',weightGoal:2300,proteinGoal:105,logs:{},measurements:[],selectedDay:0,selectedWeek:1});
let data;try{data={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=initial()}
let tab='home';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('本机存储失败，请立即导出备份。')}}function weekdayIndex(){return (new Date().getDay()+6)%7}function weekNow(){let d=new Date(data.startDate+'T12:00:00'),n=new Date();return Math.max(1,Math.min(8,Math.floor((n-d)/604800000)+1))}function weekDesc(w){return w<=2?'动作适应 · RIR 4':w<=4?'增加重复次数 · RIR 3–4':w<=6?'符合条件再小幅增重': '巩固记录 · RIR 2–3（限已许可动作）'}function allowed(id){return exercises[id].type==='upper'?data.upperCleared:data.lowerCleared}function logkey(w,d,id){return `${w}-${d}-${id}`}function getSets(w,d,id){const key=logkey(w,d,id),e=exercises[id];if(!data.logs[key])data.logs[key]=Array.from({length:e.sets},()=>({kg:'',reps:'',rir:'',done:false}));return data.logs[key]}
function notice(){return `<div class="notice"><b>左肘安全边界</b><br>累计脱臼4次以上，最近一次不足1个月，仍有不稳定感。所有上肢抗阻动作在取得医生/康复治疗师针对动作、角度及负重的明确许可前均锁定；卧推、水平飞鸟、三头肌动作即使获准也只在指定轻负荷下进行。若有滑脱感、疼痛或麻木立即停止。建议尽快专科复诊并评估是否需要影像检查。</div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home,train,library,progress,settings})[tab]();}
function home(){let count=Object.values(data.logs).flat().filter(x=>x.done).length,measure=data.measurements.slice().sort((a,b)=>a.date.localeCompare(b.date)),latest=measure.at(-1);$('app').innerHTML=`<div class="card"><h2>今天适合做什么？</h2><div class="space"><div><b>${esc(days[weekdayIndex()].name)}</b><div class="muted">${esc(days[weekdayIndex()].focus)}</div></div><button onclick="goTrain(${weekdayIndex()})">查看训练 →</button></div></div><div class="card"><div class="stats"><div class="stat"><span class="muted">计划周数</span><b>${weekNow()}/8</b></div><div class="stat"><span class="muted">已完成组数</span><b>${count}</b></div><div class="stat"><span class="muted">最新体重</span><b>${latest?.weight?esc(latest.weight)+'kg':'—'}</b></div></div></div><div class="card"><h2>本周安排</h2>${days.map((d,i)=>`<div class="day-row"><div><b>${['周一','周二','周三','周四','周五','周六','周日'][i]} · ${d.name}</b><div class="muted">${d.focus}</div></div>${d.ids.length?`<button class="secondary" onclick="goTrain(${i})">记录</button>`:'<span class="muted">—</span>'}</div>`).join('')}</div><div class="card">${notice()}</div><div class="card"><h2>营养目标</h2><div class="stats"><div class="stat"><span class="muted">热量</span><b>${esc(data.weightGoal)}</b><span class="small">kcal/天</span></div><div class="stat"><span class="muted">蛋白质</span><b>${esc(data.proteinGoal)}</b><span class="small">g/天</span></div><div class="stat"><span class="muted">目标体重</span><b>59–60</b><span class="small">kg / 8周参考</span></div></div><p class="muted">每天3餐加1–2次加餐；两周体重无增长再调整热量。</p></div>`}
window.goTrain=d=>{data.selectedDay=d;data.selectedWeek=weekNow();save();tab='train';render()};
function train(){let w=Number(data.selectedWeek)||1,d=Number(data.selectedDay)||0,day=days[d];$('app').innerHTML=`<div class="card"><h2>训练记录</h2><div class="grid2"><div class="field"><label>计划周次</label><select id="wk">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${w===i+1?'selected':''}>第${i+1}周</option>`).join('')}</select></div><div class="field"><label>训练日</label><select id="dy">${days.map((x,i)=>`<option value="${i}" ${i===d?'selected':''}>${['周一','周二','周三','周四','周五','周六','周日'][i]} · ${x.name}</option>`).join('')}</select></div></div><span class="pill">${weekDesc(w)}</span><p class="muted">每组填写重量(kg)、次数、剩余次数RIR，再勾选完成。组间休息60–120秒。上肢训练必须先获得针对性许可。</p></div>${day.ids.length?day.ids.map((id,i)=>{let e=exercises[id],a=allowed(id),sets=getSets(w,d,id);return `<div class="card"><div class="exercise-title"><strong>${i+1}. ${e.name}</strong><span class="pill ${!a?'warn':e.restricted?'warn':''}">${!a?'未解锁':e.restricted?'轻负荷限制':'已许可'}</span></div><p class="muted">${e.muscle} · ${e.sets}组 × ${e.reps}次</p>${e.restricted?'<p class="small" style="color:#9c5809">限制动作：只允许医疗人员明确规定的轻负荷、角度及方式。</p>':''}<div class="sets"><span class="head">组</span><span class="head">kg</span><span class="head">次数</span><span class="head">RIR</span><span class="head">✓</span>${sets.map((s,j)=>`<span class="small">${j+1}</span><input ${a?'':'disabled'} type="number" min="0" step="0.5" value="${esc(s.kg)}" oninput="setLog(${w},${d},'${id}',${j},'kg',this.value)"><input ${a?'':'disabled'} type="number" min="0" step="1" value="${esc(s.reps)}" oninput="setLog(${w},${d},'${id}',${j},'reps',this.value)"><input ${a?'':'disabled'} type="number" min="0" max="10" value="${esc(s.rir)}" oninput="setLog(${w},${d},'${id}',${j},'rir',this.value)"><input ${a?'':'disabled'} type="checkbox" ${s.done?'checked':''} onchange="setLog(${w},${d},'${id}',${j},'done',this.checked)">`).join('')}</div><p class="small muted">${e.detail}</p></div>`}).join(''):'<div class="card">今天安排休息、轻度活动或已获许可的康复训练。</div>'}<div class="card">${notice()}</div>`;$('wk').onchange=e=>{data.selectedWeek=Number(e.target.value);save();render()};$('dy').onchange=e=>{data.selectedDay=Number(e.target.value);save();render()};save()}
window.setLog=(w,d,id,i,field,value)=>{const a=getSets(w,d,id);if(!allowed(id))return;a[i][field]=value;save()};
function library(){let groups=[['上肢动作',Object.entries(exercises).filter(([,e])=>e.type==='upper')],['下肢动作',Object.entries(exercises).filter(([,e])=>e.type==='lower')]];$('app').innerHTML=`<div class="card"><h2>动作库</h2><p class="muted">提供文字动作要点和肌群信息。器械操作应由现场教练指导；文字说明不替代康复评估。</p></div>${groups.map(([name,items])=>`<div class="card"><h2>${name}</h2>${items.map(([id,e])=>`<details class="library-item"><summary>${e.name} <span class="pill ${e.type==='upper'?'warn':''}">${e.type==='upper'?'待许可':'下肢'}</span></summary><p><b>主要肌群：</b>${e.muscle}<br><b>计划：</b>${e.sets}组 × ${e.reps}次<br><b>要点：</b>${e.detail}</p></details>`).join('')}</div>`).join('')}`}
function plot(entries,key,label){let arr=entries.filter(x=>Number(x[key])>0).sort((a,b)=>a.date.localeCompare(b.date));if(!arr.length)return '<p class="muted">暂无数据。添加记录后显示趋势。</p>';let vals=arr.map(x=>Number(x[key])),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.15,.5),lo=min-pad,hi=max+pad;let pts=vals.map((v,i)=>`${25+(i/Math.max(1,vals.length-1))*300},${132-(v-lo)/(hi-lo)*110}`).join(' ');return `<svg class="chart" viewBox="0 0 350 160" role="img" aria-label="${label}变化趋势"><line x1="25" y1="132" x2="330" y2="132" stroke="#d4dfd7"/><polyline fill="none" stroke="#168563" stroke-width="3" stroke-linejoin="round" points="${pts}"/>${vals.map((v,i)=>`<circle cx="${25+(i/Math.max(1,vals.length-1))*300}" cy="${132-(v-lo)/(hi-lo)*110}" r="4" fill="#168563"/>`).join('')}<text x="25" y="150" font-size="10" fill="#65756f">${esc(arr[0].date)}</text><text x="330" y="150" text-anchor="end" font-size="10" fill="#65756f">${esc(arr.at(-1).date)}</text><text x="25" y="15" font-size="11" fill="#65756f">${max.toFixed(1)} ${label==='体重'?'kg':'cm'}</text></svg>`}
function progress(){let m=data.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date));let all=Object.entries(data.logs).flatMap(([key,sets])=>{let parts=key.split('-');return sets.filter(s=>s.done).map(s=>({week:Number(parts[0]),day:Number(parts[1]),id:parts.slice(2).join('-'),kg:Number(s.kg)||0,reps:Number(s.reps)||0}))});let vol=Array.from({length:8},(_,i)=>all.filter(x=>x.week===i+1).reduce((sum,x)=>sum+x.kg*x.reps,0)),max=Math.max(1,...vol);$('app').innerHTML=`<div class="card"><h2>身体数据</h2><form id="measure"><div class="grid2"><div class="field"><label>日期</label><input type="date" name="date" required value="${TODAY()}"></div><div class="field"><label>体重 kg</label><input type="number" step="0.1" min="1" name="weight" placeholder="58.0"></div><div class="field"><label>右上臂围度 cm</label><input type="number" step="0.1" min="1" name="armRight" placeholder="可选"></div><div class="field"><label>左上臂围度 cm</label><input type="number" step="0.1" min="1" name="armLeft" placeholder="可选"></div><div class="field"><label>胸围 cm</label><input type="number" step="0.1" min="1" name="chest" placeholder="可选"></div><div class="field"><label>腰围 cm</label><input type="number" step="0.1" min="1" name="waist" placeholder="可选"></div></div><button type="submit">保存测量</button></form><p class="muted">左肘不稳定时不要为测量强行伸直或用力；相同时间、相同姿势测量更便于比较。</p></div><div class="card"><h2>体重趋势</h2>${plot(m,'weight','体重')}</div><div class="card"><h2>右上臂围度趋势</h2>${plot(m,'armRight','围度')}</div><div class="card"><h2>每周训练总量</h2><p class="muted">完成组数 × 重量 × 次数，仅供观察；不同器械的总量不能直接比较。</p>${vol.map((v,i)=>`<div class="space small" style="margin:9px 0 3px"><span>第${i+1}周</span><b>${Math.round(v)} kg·次</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div>`).join('')}</div><div class="card"><h2>测量记录</h2>${m.length?m.slice(0,25).map(x=>`<div class="day-row"><div><b>${esc(x.date)}</b><div class="muted">体重 ${esc(x.weight||'—')}kg · 右臂 ${esc(x.armRight||'—')}cm · 左臂 ${esc(x.armLeft||'—')}cm</div></div><button class="secondary" onclick="delMeasure('${esc(x.id)}')">删除</button></div>`).join(''):'<p class="muted">尚无记录</p>'}</div>`;$('measure').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),entry={id:String(Date.now()),date:f.get('date')};['weight','armRight','armLeft','chest','waist'].forEach(k=>entry[k]=f.get(k));if(!['weight','armRight','armLeft','chest','waist'].some(k=>Number(entry[k])>0)){alert('请至少填写一个测量值');return}data.measurements.push(entry);save();render()}}
window.delMeasure=id=>{if(confirm('确认删除这条测量记录？')){data.measurements=data.measurements.filter(x=>x.id!==id);save();render()}};
function settings(){$('app').innerHTML=`<div class="card"><h2>计划设置</h2><div class="field"><label>第1周开始日期</label><input type="date" id="start" value="${esc(data.startDate)}"></div><div class="grid2"><div class="field"><label>每日热量目标 kcal</label><input type="number" id="cal" min="1000" max="6000" value="${esc(data.weightGoal)}"></div><div class="field"><label>每日蛋白质目标 g</label><input type="number" id="protein" min="20" max="300" value="${esc(data.proteinGoal)}"></div></div><button id="saveSettings">保存设置</button></div><div class="card"><h2>训练许可状态</h2><div class="notice">勾选仅用于记录医生/康复治疗师已明确批准的活动，不代表 App 作出医学判断。上肢许可必须明确覆盖本计划中的动作、活动范围和负荷；不能只凭“避免完全伸直”勾选。</div><div style="margin-top:14px"><label><input id="lower" type="checkbox" ${data.lowerCleared?'checked':''}> 已获准进行无需左肘承重的下肢器械训练</label></div><div style="margin-top:12px"><label><input id="upper" type="checkbox" ${data.upperCleared?'checked':''}> 已获准执行本计划中的全部上肢动作，且明确了角度与负荷限制</label></div><div class="field" style="margin-top:12px"><label>医疗人员给出的限制（请记录具体负重、角度、日期）</label><textarea id="upperNote" rows="3" style="width:100%" placeholder="例如：许可日期、哪些动作允许、重量上限、角度范围">${esc(data.upperNote)}</textarea></div><button id="saveClearance">保存许可状态</button><p class="muted">如果只许可部分上肢动作，请勿开启整体上肢许可；未获许可的动作仍不应执行。</p></div><div class="card"><h2>数据备份与恢复</h2><p class="muted">数据保存在当前 iPhone 浏览器/主屏幕 App 的本地存储中，不上传服务器。清除网站数据、删除 App、设备损坏或系统清理都可能导致记录丢失。建议每周导出 JSON 备份到“文件”App 或 iCloud Drive。</p><div class="flex"><button id="export">导出完整备份 JSON</button><button class="secondary" id="exportCsv">导出训练 CSV</button></div><div class="field" style="margin-top:15px"><label>从备份恢复（会覆盖当前数据）</label><input type="file" id="import" accept="application/json,.json" style="width:100%"></div></div><div class="card"><h2>关于离线使用</h2><p class="muted">首次通过 HTTPS 网站打开后，浏览器会尝试缓存 App 文件。安装到主屏幕后可以离线打开并记录。Safari 与主屏幕 App 的数据空间可能不完全相同，建议在最终使用入口中维护记录并定期备份。</p></div>`;$('saveSettings').onclick=()=>{let date=$('start').value,cal=Number($('cal').value),protein=Number($('protein').value);if(!date||cal<1000||cal>6000||protein<20||protein>300)return alert('请检查设置数值');data.startDate=date;data.weightGoal=cal;data.proteinGoal=protein;save();alert('已保存')};$('saveClearance').onclick=()=>{let up=$('upper').checked,low=$('lower').checked,note=$('upperNote').value;if(up&&!confirm('请确认：医疗专业人员已明确批准本计划所有上肢动作，并给出了适用的活动范围与负重限制。是否继续？'))return;data.upperCleared=up;data.lowerCleared=low;data.upperNote=note;save();render();alert('许可状态已保存')};$('export').onclick=()=>download('增肌手账-备份-'+TODAY()+'.json',JSON.stringify(data,null,2),'application/json');$('exportCsv').onclick=()=>{let rows=[['周次','训练日','动作','组数序号','重量kg','次数','RIR','已完成']];Object.entries(data.logs).forEach(([k,sets])=>{let p=k.split('-'),id=p.slice(2).join('-');sets.forEach((s,i)=>rows.push([p[0],days[Number(p[1])]?.name||'',exercises[id]?.name||id,i+1,s.kg,s.reps,s.rir,s.done?'是':'否']))});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('增肌手账-训练-'+TODAY()+'.csv',csv,'text/csv;charset=utf-8')};$('import').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(parsed.version!==1||!parsed.logs||!Array.isArray(parsed.measurements)||!confirm('恢复备份将覆盖当前全部数据，确定继续？'))return;data={...initial(),...parsed};save();render();alert('备份已恢复')}catch(err){alert('备份文件格式错误，未修改当前数据')}}}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
